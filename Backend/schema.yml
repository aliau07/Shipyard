components:
  schemas:
    AccountCreateRequest:
      type: object
      description: New account details, checked with Django's password validators.
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - email
      - password
      - username
    ActionEnum:
      enum:
      - submit
      - sign_off
      - approve
      - request_changes
      - start
      - mark_released
      - block
      - unblock
      - cancel
      - reopen
      type: string
      description: |-
        * `submit` - submit
        * `sign_off` - sign_off
        * `approve` - approve
        * `request_changes` - request_changes
        * `start` - start
        * `mark_released` - mark_released
        * `block` - block
        * `unblock` - unblock
        * `cancel` - cancel
        * `reopen` - reopen
    BlankEnum:
      enum:
      - ''
    Change:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        component:
          type: integer
        component_name:
          type: string
          readOnly: true
        component_kind:
          type: string
          readOnly: true
        owner:
          type: integer
          readOnly: true
        owner_name:
          type: string
          readOnly: true
        change_type:
          $ref: '#/components/schemas/ChangeTypeEnum'
        change_type_display:
          type: string
          readOnly: true
        summary:
          type: string
          maxLength: 300
        added_by_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
      required:
      - added_by_name
      - change_type_display
      - component
      - component_kind
      - component_name
      - id
      - owner
      - owner_name
      - summary
    ChangeInputRequest:
      type: object
      properties:
        component:
          type: integer
        summary:
          type: string
          minLength: 1
          maxLength: 300
        change_type:
          $ref: '#/components/schemas/ChangeTypeEnum'
      required:
      - component
      - summary
    ChangeTypeEnum:
      enum:
      - feature
      - fix
      - breaking
      - chore
      type: string
      description: |-
        * `feature` - Feature
        * `fix` - Fix
        * `breaking` - Breaking change
        * `chore` - Maintenance
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        author_name:
          type: string
          readOnly: true
        body:
          type: string
          maxLength: 4000
        screenshots:
          type: array
          items:
            $ref: '#/components/schemas/Screenshot'
          readOnly: true
        created_at:
          type: string
          format: date-time
      required:
      - author_name
      - body
      - id
      - screenshots
    CommentCreateRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000
        images:
          type: array
          items:
            type: string
            format: binary
          maxItems: 5
      required:
      - body
    Component:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: integer
          readOnly: true
        name:
          type: string
          pattern: ^[a-z0-9][a-z0-9._-]*$
          maxLength: 80
        kind:
          $ref: '#/components/schemas/ComponentKindEnum'
        kind_display:
          type: string
          readOnly: true
        owner:
          type: integer
          nullable: true
        owner_name:
          type: string
          readOnly: true
        package_name:
          type: string
          description: Name in requirements.txt or package.json, if not the component
            name.
          maxLength: 214
        deploy_minutes:
          type: integer
          maximum: 1440
          minimum: 1
          description: Estimated time to deploy and verify.
        description:
          type: string
          maxLength: 500
        repository_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        dependency_count:
          type: integer
          readOnly: true
          default: 0
        dependent_count:
          type: integer
          readOnly: true
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - dependency_count
      - dependent_count
      - id
      - kind_display
      - name
      - owner_name
      - project
    ComponentCreateRequest:
      type: object
      properties:
        project:
          type: integer
        name:
          type: string
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9._-]*$
          maxLength: 80
        kind:
          $ref: '#/components/schemas/ComponentKindEnum'
        owner:
          type: integer
          nullable: true
        package_name:
          type: string
          description: Name in requirements.txt or package.json, if not the component
            name.
          maxLength: 214
        deploy_minutes:
          type: integer
          maximum: 1440
          minimum: 1
          description: Estimated time to deploy and verify.
        description:
          type: string
          maxLength: 500
        repository_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
      required:
      - name
      - project
    ComponentKindEnum:
      enum:
      - service
      - library
      - frontend
      type: string
      description: |-
        * `service` - Service
        * `library` - Library
        * `frontend` - Frontend
    Dependency:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        component:
          type: integer
        component_name:
          type: string
          readOnly: true
        depends_on:
          type: integer
        depends_on_name:
          type: string
          readOnly: true
        source:
          allOf:
          - $ref: '#/components/schemas/DependencySourceEnum'
          readOnly: true
        source_display:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - component
      - component_name
      - created_at
      - depends_on
      - depends_on_name
      - id
      - source
      - source_display
    DependencyCreated:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        component:
          type: integer
        component_name:
          type: string
          readOnly: true
        depends_on:
          type: integer
        depends_on_name:
          type: string
          readOnly: true
        source:
          allOf:
          - $ref: '#/components/schemas/DependencySourceEnum'
          readOnly: true
        source_display:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        cycle:
          type: array
          items:
            type: string
          readOnly: true
          nullable: true
      required:
      - component
      - component_name
      - created_at
      - cycle
      - depends_on
      - depends_on_name
      - id
      - source
      - source_display
    DependencyRequest:
      type: object
      properties:
        component:
          type: integer
        depends_on:
          type: integer
      required:
      - component
      - depends_on
    DependencySourceEnum:
      enum:
      - manual
      - manifest
      type: string
      description: |-
        * `manual` - Added by hand
        * `manifest` - Imported from a manifest
    Impact:
      type: object
      properties:
        name:
          type: string
        depth:
          type: integer
        path:
          type: array
          items:
            type: string
        in_view:
          type: boolean
      required:
      - depth
      - in_view
      - name
      - path
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - password
      - username
    ManifestResult:
      type: object
      properties:
        format:
          type: string
        packages:
          type: integer
        created:
          type: array
          items:
            type: string
        existing:
          type: array
          items:
            type: string
        unmatched:
          type: array
          items:
            type: string
        cycle:
          type: array
          items:
            type: string
          nullable: true
      required:
      - created
      - cycle
      - existing
      - format
      - packages
      - unmatched
    ManifestUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: A requirements.txt (or other pip .txt file) or a package.json.
      required:
      - file
    MemberAddRequest:
      type: object
      properties:
        user:
          type: string
          minLength: 1
          description: Username or email address of an existing account.
        role:
          allOf:
          - $ref: '#/components/schemas/MembershipRoleEnum'
          default: engineer
      required:
      - user
    Membership:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/PublicUser'
          readOnly: true
        role:
          $ref: '#/components/schemas/MembershipRoleEnum'
        role_display:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - role_display
      - user
    MembershipRoleEnum:
      enum:
      - owner
      - release_manager
      - engineer
      type: string
      description: |-
        * `owner` - Owner
        * `release_manager` - Release manager
        * `engineer` - Engineer
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        release:
          type: integer
        release_reference:
          type: string
          readOnly: true
        project_name:
          type: string
          readOnly: true
        message:
          type: string
          maxLength: 300
        created_at:
          type: string
          format: date-time
          readOnly: true
        read_at:
          type: string
          format: date-time
          nullable: true
        is_read:
          type: boolean
          readOnly: true
