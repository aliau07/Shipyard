openapi: 3.0.3
info:
  title: Shipyard Release Planning API
  version: 1.0.0
  description: 'Release dependency planning for software teams: projects, components,
    dependencies, manifest imports, releases with sign-off workflow, deploy waves,
    critical path, impact analysis, comments with screenshots, notifications and dashboards.'
paths:
  /api/auth/logout/:
    post:
      operationId: api_auth_logout_create
      description: Revoke the caller's API token.
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: api_auth_me_retrieve
      description: The signed-in user's details.
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: api_auth_me_partial_update
      description: The signed-in user's details.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/register/:
    post:
      operationId: api_auth_register_create
      description: Anyone can sign up; they then create a project or are added to
        one by its owner.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/auth/token/:
    post:
      operationId: api_auth_token_create
      description: Exchange a username (or email) and password for an API token.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/components/:
    get:
      operationId: api_components_list
      description: Components of your projects. Filter with ?project=<id>.
      parameters:
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - frontend
          - library
          - service
        description: |-
          * `service` - Service
          * `library` - Library
          * `frontend` - Frontend
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: owner
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedComponentList'
          description: ''
    post:
      operationId: api_components_create
      description: Components of your projects. Filter with ?project=<id>.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComponentCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ComponentCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ComponentCreateRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
          description: ''
  /api/components/{id}/:
    get:
      operationId: api_components_retrieve
      description: Components of your projects. Filter with ?project=<id>.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this component.
        required: true
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
          description: ''
    patch:
      operationId: api_components_partial_update
      description: Components of your projects. Filter with ?project=<id>.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this component.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedComponentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedComponentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedComponentRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
          description: ''
    delete:
      operationId: api_components_destroy
      description: Components of your projects. Filter with ?project=<id>.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this component.
        required: true
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/components/{id}/impact/:
    get:
      operationId: api_components_impact_list
      description: Every component that depends on this one, directly or not, with
        the path that reaches it.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this component.
        required: true
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - frontend
          - library
          - service
        description: |-
          * `service` - Service
          * `library` - Library
          * `frontend` - Frontend
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: owner
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedImpactList'
          description: ''
  /api/components/{id}/manifest/:
    post:
      operationId: api_components_manifest_create
      description: 'Upload a requirements.txt or package.json: packages that match
        components become dependencies.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this component.
        required: true
      tags:
      - api
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ManifestUploadRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestResult'
          description: ''
  /api/dashboard/:
    get:
      operationId: api_dashboard_retrieve
      description: Release figures across your projects, or for one project with ?project=<id>.
      parameters:
      - in: query
        name: project
        schema:
          type: integer
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/dependencies/:
    get:
      operationId: api_dependencies_list
      description: '`component` depends on `depends_on`. Filter with ?project=<id>
        or ?component=<id>.'
      parameters:
      - in: query
        name: component
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: integer
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dependency'
          description: ''
    post:
      operationId: api_dependencies_create
      description: '`component` depends on `depends_on`. Filter with ?project=<id>
        or ?component=<id>.'
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependencyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DependencyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DependencyRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyCreated'
          description: ''
  /api/dependencies/{id}/:
    delete:
      operationId: api_dependencies_destroy
      description: '`component` depends on `depends_on`. Filter with ?project=<id>
        or ?component=<id>.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this dependency.
        required: true
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/health/:
    get:
      operationId: api_health_retrieve
      description: Liveness/readiness probe for load balancers and uptime checks;
        fails if the database is unreachable.
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/notifications/:
    get:
      operationId: api_notifications_list
      description: |-
        Viewsets whose rows depend on the signed-in user implement `scoped_queryset()`.

        The OpenAPI generator inspects views without a user, so it gets the empty `queryset` instead.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: unread
        schema:
          type: boolean
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/notifications/{id}/read/:
    post:
      operationId: api_notifications_read_create
      description: |-
        Viewsets whose rows depend on the signed-in user implement `scoped_queryset()`.

        The OpenAPI generator inspects views without a user, so it gets the empty `queryset` instead.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this notification.
        required: true
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/notifications/read-all/:
    post:
      operationId: api_notifications_read_all_create
      description: |-
        Viewsets whose rows depend on the signed-in user implement `scoped_queryset()`.

        The OpenAPI generator inspects views without a user, so it gets the empty `queryset` instead.
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/notifications/unread-count/:
    get:
      operationId: api_notifications_unread_count_retrieve
      description: Cheap endpoint the React app polls for the bell badge.
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
          description: ''
  /api/projects/:
    get:
      operationId: api_projects_list
      description: Projects you belong to. Creating one makes you its owner.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectList'
          description: ''
    post:
      operationId: api_projects_create
      description: Projects you belong to. Creating one makes you its owner.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
          description: ''
  /api/projects/{id}/:
    get:
      operationId: api_projects_retrieve
      description: Projects you belong to. Creating one makes you its owner.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this project.
        required: true
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
          description: ''
    patch:
      operationId: api_projects_partial_update
      description: Projects you belong to. Creating one makes you its owner.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this project.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProjectRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
          description: ''
    delete:
      operationId: api_projects_destroy
      description: Projects you belong to. Creating one makes you its owner.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this project.
        required: true
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/projects/{id}/graph/:
    get:
      operationId: api_projects_graph_retrieve
      description: The whole dependency graph laid out in waves, with any cycle and
        every component's impact paths.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this project.
        required: true
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/projects/{id}/members/:
    post:
      operationId: api_projects_members_create
      description: Owners add an existing account by username or email.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this project.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberAddRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MemberAddRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MemberAddRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
  /api/projects/{id}/members/{membership_id}/:
    patch:
      operationId: api_projects_members_partial_update
      description: Owners change roles or remove people; anyone may remove themselves.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this project.
        required: true
      - in: path
        name: membership_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMemberRoleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMemberRoleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMemberRoleRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
    delete:
      operationId: api_projects_members_destroy
      description: Owners change roles or remove people; anyone may remove themselves.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this project.
        required: true
      - in: path
        name: membership_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/releases/:
    get:
      operationId: api_releases_list
      description: Releases of your projects. What you can do depends on your project
        role (see `allowed_actions`).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - blocked
          - cancelled
          - draft
          - in_progress
          - in_review
          - released
        description: |-
          * `draft` - Draft
          * `in_review` - In review
          * `approved` - Approved
          * `in_progress` - In progress
          * `released` - Released
          * `blocked` - Blocked
          * `cancelled` - Cancelled
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReleaseListList'
          description: ''
    post:
      operationId: api_releases_create
      description: Releases of your projects. What you can do depends on your project
        role (see `allowed_actions`).
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReleaseCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReleaseCreateRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseDetail'
          description: ''
  /api/releases/{id}/:
    get:
      operationId: api_releases_retrieve
      description: Releases of your projects. What you can do depends on your project
        role (see `allowed_actions`).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this release.
        required: true
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseDetail'
          description: ''
    patch:
      operationId: api_releases_partial_update
      description: Releases of your projects. What you can do depends on your project
        role (see `allowed_actions`).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this release.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedReleaseUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedReleaseUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedReleaseUpdateRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseDetail'
          description: ''
  /api/releases/{id}/changes/:
    post:
      operationId: api_releases_changes_create
      description: Add a component change to a draft release.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this release.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangeInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangeInputRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
          description: ''
  /api/releases/{id}/changes/{change_id}/:
    delete:
      operationId: api_releases_changes_destroy
      description: Releases of your projects. What you can do depends on your project
        role (see `allowed_actions`).
      parameters:
      - in: path
        name: change_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this release.
        required: true
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/releases/{id}/comments/:
    post:
      operationId: api_releases_comments_create
      description: Comment as JSON, or as multipart form data with a `body` and up
        to five `images` (screenshots).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this release.
        required: true
      tags:
      - api
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
  /api/releases/{id}/export/:
    get:
      operationId: api_releases_export_retrieve
      description: 'Download the deploy plan as CSV: waves, order, owners, timings,
        sign-offs and impact.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this release.
        required: true
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
          description: ''
  /api/releases/{id}/transition/:
    post:
      operationId: api_releases_transition_create
      description: 'Move the release through its workflow, e.g. {"action": "block",
        "reason": "Waiting for DBA"}.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this release.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseDetail'
          description: ''
  /api/schema/:
    get:
      operationId: api_schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
